name: Party Night Quality Gate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Verify required production files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f pro-v27.css
          test -f trivia-pro-v27.js
          test -f platform-pro-v27.js
          test -f games-pro-v27.js
          test -f platform-foundation-v31.js
          test -f content-modes-v31.js
          test -f duel-content-v31.js
          test -f duel-games-v31.js
          test -f party-director-v31.js
          test -f foundation-hotfix-v31.js
          test -f duel-hub-v31.js
          test -f identity-v31.js
          test -f duel-v31.css
          test -f duel-hub-v31.css
          test -f docs/PRODUCT-ARCHITECTURE-v31.md
          grep -q "platform-foundation-v31.js" polish-v22-runtime.js
          grep -q "duel-games-v31.js" polish-v22-runtime.js
          grep -q "party-director-v31.js" polish-v22-runtime.js
          grep -q "foundation-hotfix-v31.js" polish-v22-runtime.js
          grep -q "duel-hub-v31.js" polish-v22-runtime.js
          grep -q "identity-v31.js" polish-v22-runtime.js
          grep -q "platform-foundation-v31.js" sw.js
          grep -q "duel-hub-v31.js" sw.js
